# target-dir 历史与裁定（读我再改）：
# S78：mingw ld 在含中文路径下链接失败 ⇒ target-dir 挪纯 ASCII 目录。
# S124：cargo 只从当前工作目录逐级向上发现本文件；CI 由 CARGO_TARGET_DIR 环境变量覆盖
#       （env 优先于本文件，core.yml 显式设置）。
# 2026-10-04（adv-rewrite 分支）：工作区路径 D:/KF/ADV 已是纯 ASCII ⇒ target 回工作区内
# target/（C 盘满盘风险消除）。主仓 main 的本文件不受影响（各自 worktree 各自文件）。
# 若未来路径再含非 ASCII，恢复 ASCII 绝对路径并在此留痕。
[build]
target-dir = "target"

# 深轨边车（docs/PLAN-deep-track.md §1）：stable 1.99.0 上用 `rustc_private` 需放开 feature gate。
# RUSTC_BOOTSTRAP=1 是 clippy/miri 自用档，只在本仓被 cargo 发现的本文件内生效，不污染全局，
# 也不引入 nightly（避免 rust-toolchain.toml 的单一事实源被破）。
[env]
RUSTC_BOOTSTRAP = "1"

# M3-1（2026-10-07）：内化 Nosey Parker 后，GNU 目标需要放行"重复符号定义"，否则**链接**失败。
# 实测（HEAD 前的探针）：`vectorscan-rs-sys 0.0.5` 的自带 C++ 源码里
# `SuperVector<unsigned short>16>::SuperVector(const&)` 同时被 `impl.cpp.obj` 与
# `noodle_engine.cpp.obj` 定义 ⇒ `ld: multiple definition`（GCC 16 / windows-gnu）。
# 上游 CI 走 MSVC，这条组合它没覆盖。给 GNU 目标加这一个链接旗标后，
# `adv-secrets` 的两条金丝雀（合成 key 命中 / 干净零报 / 同内容去重 / 掩码）实测全过。
# **代价如实记**：它把 GNU 目标下"重复符号"这一类链接错误从"报错"降成"静默取其一"，
# 影响面是全仓而不只是上游那份 C++。守它的办法是 adv-secrets 的金丝雀——真出 ODR 问题
# 会先在行为断言上露出来，而不是在链接期。
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-Wl,--allow-multiple-definition"]
