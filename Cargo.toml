[workspace]
resolver = "2"
# adv-rewrite 分支（蓝图 docs/BLUEPRINT.md §4）。
# adv-ast-rust（深轨边车）2026-10-05 片A1 入列：走 RUSTC_BOOTSTRAP=1 + rustc-dev，
# 不引入 nightly（裁定与理由见 docs/PLAN-deep-track.md §1）。
members = [
    "crates/adv-core",
    "crates/adv-parse",
    "crates/adv-rules",
    "crates/adv-taint",
    "crates/adv-secrets",
    "crates/adv-sca",
    "crates/adv-index",
    "crates/adv-server",
    "crates/adv-sandbox",
    "crates/adv-bin",
    "crates/adv-cli",
    "crates/adv-ast-rust",
    "xtask",
]
# 旧仓 Rust 引擎是独立 package，不并入新 workspace（切换日随旧代码整体移除）。
# 2026-10-04 实测：无此 exclude 时 rust/ 子仓向上发现根 workspace 报
# "believes it's in a workspace when it's not"，旧项目 cargo 门全断。
exclude = ["rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/bfxh/ADV"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
walkdir = "2"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[profile.release]
lto = "thin"
panic = "abort"
strip = "symbols"
# 注：panic=abort 与 catch_unwind 互斥（RESEARCH X8 调和方案）——默认档放弃 unwind 隔离，
# 不可信输入隔离走 worker 进程池（M6 沙箱里程碑落实）。profile.test/dev 自动豁免。
codegen-units = 1
