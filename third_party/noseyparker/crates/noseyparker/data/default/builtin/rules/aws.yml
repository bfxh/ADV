rules:

- name: AWS API Key
  id: np.aws.1

  pattern: '\b((?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16})\b'

  references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html
  - https://docs.aws.amazon.com/accounts/latest/reference/credentials-access-keys-best-practices.html

  categories:
  - api
  - identifier

- name: AWS Secret Access Key
  id: np.aws.2

  pattern: |
    (?x)(?i)
    \b
    aws_? (?:secret)? _? (?:access)? _? (?:key)?
    ["'']?
    \s{0,30}
    (?::|=>|=)
    \s{0,30}
    ["'']?
    ([a-z0-9/+=]{40})
    (?: [^a-z0-9/+=] | $ )

  references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html
  - https://docs.aws.amazon.com/accounts/latest/reference/credentials-access-keys-best-practices.html

  categories:
  - api
  - fuzzy
  - secret

- name: AWS Account ID
  id: np.aws.3

  pattern: '(?i)aws_?(?:account)_?(?:id)?["''`]?\s{0,30}(?::|=>|=)\s{0,30}["''`]?([0-9]{4}-?[0-9]{4}-?[0-9]{4})'

  categories:
  - api
  - fuzzy
  - identifier

- name: AWS Session Token
  id: np.aws.4
  pattern: '(?i)(?:aws.?session|aws.?session.?token|aws.?token)["''`]?\s{0,30}(?::|=>|=)\s{0,30}["''`]?([a-z0-9/+=]{16,200})[^a-z0-9/+=]'

  categories:
  - api
  - fuzzy
  - secret

- name: Amazon MWS Auth Token
  id: np.aws.5
  pattern: '(?i)(amzn\.mws\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'

  categories:
  - api

  references:
  - https://docs.developer.amazonservices.com/en_US/dev_guide/index.html


- name: AWS S3 Bucket
  id: np.s3.1

  pattern: |
    (?x)
    (?: ^ | [\s/"'] | %2F )
    (
    (?: [a-zA-Z0-9_-]+ \. )+   (?# bucket name as subdomain )
    (?: s3
      | s3-af-south-1
      | s3-ap-east-1
      | s3-ap-northeast-1
      | s3-ap-northeast-2
      | s3-ap-northeast-3
      | s3-ap-south-1
      | s3-ap-south-2
      | s3-ap-southeast-1
      | s3-ap-southeast-2
      | s3-ap-southeast-3
      | s3-ap-southeast-4
      | s3-ca-central-1
      | s3-eu-central-1
      | s3-eu-central-2
      | s3-eu-north-1
      | s3-eu-south-1
      | s3-eu-south-2
      | s3-eu-west-1
      | s3-eu-west-2
      | s3-eu-west-3
      | s3-me-central-1
      | s3-me-south-1
      | s3-sa-east-1
      | s3-us-east-1
      | s3-us-east-2
      | s3-us-gov-east-1
      | s3-us-gov-west-1
      | s3-us-west-1
      | s3-us-west-2
      )
    \.amazonaws\.com
    ) \b

  references:
  - https://docs.aws.amazon.com/general/latest/gr/rande.html

  categories:
  - api
  - identifier

- name: AWS S3 Bucket
  id: np.s3.2

  pattern: |
    (?x)
    (?: ^ | [\s/"'] | %2F )
    (
    (?: s3
      | s3-af-south-1
      | s3-ap-east-1
      | s3-ap-northeast-1
      | s3-ap-northeast-2
      | s3-ap-northeast-3
      | s3-ap-south-1
      | s3-ap-south-2
      | s3-ap-southeast-1
      | s3-ap-southeast-2
      | s3-ap-southeast-3
      | s3-ap-southeast-4
      | s3-ca-central-1
      | s3-eu-central-1
      | s3-eu-central-2
      | s3-eu-north-1
      | s3-eu-south-1
      | s3-eu-south-2
      | s3-eu-west-1
      | s3-eu-west-2
      | s3-eu-west-3
      | s3-me-central-1
      | s3-me-south-1
      | s3-sa-east-1
      | s3-us-east-1
      | s3-us-east-2
      | s3-us-gov-east-1
      | s3-us-gov-west-1
      | s3-us-west-1
      | s3-us-west-2
      )
    \.amazonaws\.com
    /
    [a-zA-Z0-9_][a-zA-Z0-9_-]* (?: \. [a-zA-Z0-9_-]+)*   (?# bucket name as path )
    )
    (?: [^a-zA-Z0-9_-] | $ )                             (?# this instead of a \b anchor because that doesn't play nicely with `-` )

  references:
  - https://docs.aws.amazon.com/general/latest/gr/rande.html

  categories:
  - api
  - identifier

- name: Amazon Resource Name
  id: np.arn.1

  pattern: |
    (?x)
    \b
    (
      arn
      :
      (?: aws | aws-cn | aws-us-gov )         (?# partition )
      :
      [a-zA-Z0-9_-]{2,}                       (?# service )
      :
      (?: af-south-1
        | ap-east-1
        | ap-northeast-1
        | ap-northeast-2
        | ap-northeast-3
        | ap-south-1
        | ap-south-2
        | ap-southeast-1
        | ap-southeast-2
        | ap-southeast-3
        | ap-southeast-4
        | ca-central-1
        | eu-central-1
        | eu-central-2
        | eu-north-1
        | eu-south-1
        | eu-south-2
        | eu-west-1
        | eu-west-2
        | eu-west-3
        | me-central-1
        | me-south-1
        | sa-east-1
        | us-east-1
        | us-east-2
        | us-gov-east-1
        | us-gov-west-1
        | us-west-1
        | us-west-2
        )?                                    (?# region )
      :
      (?: \d{12} )?                           (?# account ID sans hyphens )
      :
      (?: [a-zA-Z0-9_-]+ [:/])?               (?# resource type)
      [^\s"'&<>\\%]+                          (?# resource ID)
    )
    (?: [\s"'&<>\\%] | $ )

  references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference-arns.html

  categories:
  - api
  - identifier

- name: AWS AppSync API Key
  id: np.appsync.1
  pattern: |
    (?x)
    \b
    (da2-[a-z0-9]{26})
    \b

  # Note: AWS AppSync provides several authorization mechanisms.
  # This API Key mechanism is but one.
  # It is also not clear that an AWS AppKey is _always_ secret:
  #
  #     An API key is a hard-coded value in your application that is generated
  #     by the AWS AppSync service when you create an unauthenticated GraphQL
  #     endpoint.
  #
  #     ...
  #
  #     API keys are configurable for up to 365 days, and you can extend an
  #     existing expiration date for up to another 365 days from that day. API
  #     Keys are recommended for development purposes or use cases where it’s
  #     safe to expose a public API.
  references:
  - https://docs.aws.amazon.com/appsync/latest/devguide/security-authz.html#api-key-authorization

  categories:
  - api
  - secret

- name: AWS API Credentials
  id: np.aws.6

  pattern: |
    (?x)
    \b
    ((?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16})     (?# API key )
    \b
    (?: (?s) .{0,40} )                                                        (?# Arbitrary intermediate stuff; ?s causes . to match newlines )
    \b
    ([A-Za-z0-9/+=]{40})                                                      (?# secret )
    (?: [^A-Za-z0-9/+=] | $ )

  references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html
  - https://docs.aws.amazon.com/accounts/latest/reference/credentials-access-keys-best-practices.html

  categories:
  - api
  - fuzzy
  - secret

