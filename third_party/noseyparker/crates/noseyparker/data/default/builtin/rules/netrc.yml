rules:

- name: netrc Credentials
  id: np.netrc.1

  pattern: |
    (?x)
    ( machine \s+ [^\s]+ | default )
    \s+
    login \s+ ([^\s]+)
    \s+
    password \s+ ([^\s]+)

  categories: [secret]

  references:
  - https://everything.curl.dev/usingcurl/netrc
  - https://devcenter.heroku.com/articles/authentication#api-token-storage

