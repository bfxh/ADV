rules:

- name: Credentials in PsExec Invocation
  id: np.psexec.1

  pattern: |
    (?x)
    (?i)
    psexec .{0,100}
    -u \s* (\S+) \s+    (?# username )
    -p \s* (\S+)        (?# password )

  categories: [fuzzy, secret]

  references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
