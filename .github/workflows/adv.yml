# ADV CI 阶段 0（蓝图 §7：GitHub Actions 过渡档；自托管切换见 RESEARCH 05）。
# 旧项目 workflows（codeql/core/health/release/scan）在切换日移除——本文件只管新工作区。
name: adv

on:
  push:
    branches: [adv-rewrite, main]
  pull_request:

concurrency:
  group: adv-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Debt gate 的 D4/D5 要按短 SHA 查历史并数 commit：默认 depth=1 会让所有 since/origin
          # 查不到 ⇒ 14 条假红盖住真正该看的超期信号（2026-10-06 实测）。与 core.yml 同口径。
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] ref 即工具链名，无固定 SHA 语义
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest,cargo-deny,cargo-llvm-cov
      # 内化 Nosey Parker（third_party/noseyparker，见其 VENDOR.md）引入 vectorscan 这个 C++ 原生库。
      # 实测 runner 清单（images/windows/Windows2025-Readme.md）：**有** CMake 3.31 / Ninja 1.13 /
      # MSYS2(C:\msys64)，**没有** Boost 与 mingw32-make ⇒ 这两样在这里补。
      - name: vectorscan 构建前置（Boost + mingw32-make）
        shell: bash
        run: /c/msys64/usr/bin/pacman -S --noconfirm --needed mingw-w64-x86_64-boost mingw-w64-x86_64-make
      # 冷建要编 vectorscan（本机实测 21m43s）；缓存它的构建目录，键含 vendored 提交号
      # ⇒ 上游一换（VENDOR.md 里那个 SHA）缓存自然失效，不会拿旧产物配新源码。
      - name: 缓存 vectorscan 构建产物
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            target/debug/build/vectorscan-rs-sys-*
            target/release/build/vectorscan-rs-sys-*
          key: vectorscan-${{ runner.os }}-${{ hashFiles('third_party/noseyparker/VENDOR.md') }}
      - name: fmt（只面本仓成员；cargo fmt --all 会格式化 vendored 上游源码）
        run: python -X utf8 scripts/fmt_workspace.py
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (nextest)
        run: cargo nextest run --workspace
      - name: coverage（lcov 工件；棘轮阈值待 M2 基线后接）
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: gates（god 棘轮 + 版本锁步 + 抑制到期；本地与 CI 同尺）
        run: cargo run -p xtask -- gate
      # 设计债到期门接在**这条分支真正跑的 workflow**上：core.yml 只守 main（见其 on.push
      # 注释），昨天把 Debt gate 写进 core.yml 等于没接——adv-rewrite 上它一步都没跑过。
      # 纯 stdlib（json/re/subprocess），不需 pip 依赖；setup-python 沿用 core.yml 的 SHA 钉法。
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: CI wiring gate（分支 × 生效门集合；防"门接在不守这条分支的 workflow 上"）
        run: python -X utf8 scripts/ci_wiring_gate.py
      - name: Debt gate（设计债到期：成因必填 + ≤10 commit 限期 + SHA 可核）
        run: python -X utf8 scripts/debt_gate.py
      - name: deny（license/advisory/ban）
        run: cargo deny check
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-junit
          path: target/nextest/**/*.junit.xml
          if-no-files-found: ignore
      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore
