# ADV CI 阶段 0（蓝图 §7：GitHub Actions 过渡档；自托管切换见 RESEARCH 05）。
# 旧项目 workflows（codeql/core/health/release/scan）在切换日移除——本文件只管新工作区。
name: adv

on:
  push:
    branches: [adv-rewrite, main]
  pull_request:

concurrency:
  group: adv-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Debt gate 的 D4/D5 要按短 SHA 查历史并数 commit：默认 depth=1 会让所有 since/origin
          # 查不到 ⇒ 14 条假红盖住真正该看的超期信号（2026-10-06 实测）。与 core.yml 同口径。
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] ref 即工具链名，无固定 SHA 语义
        with:
          components: clippy, rustfmt
      # **CI 与本地同尺：gnu host**（2026-10-07 实测定）。runner 的 default-host 是 msvc，
      # 而 `rust-toolchain.toml` 把 channel 钉成 `1.99.0` ⇒ CI 会解析出 1.99.0-**msvc**；
      # 内化 Nosey Parker 带的 vectorscan 只吃 gcc/clang 的 C++ 工具链、且要 CMake 找到 mingw 的 Boost
      # （MSVC 生成器下 find_package(Boost) 直接 "Configuring incomplete"，实测原文）。
      # 所以显式装 gnu host 的同一版本，并用 RUSTUP_TOOLCHAIN 覆盖本文件解析——版本号与本仓
      # `rust-toolchain.toml` 的 channel 保持一致（改一处要改两处，已在账本登记）。
      - name: 装 GNU host 的 Rust 工具链（与 rust-toolchain.toml 同版本）
        shell: bash
        run: |
          rustup toolchain install 1.99.0-x86_64-pc-windows-gnu --profile minimal --component rustfmt,clippy,rustc-dev
          echo "RUSTUP_TOOLCHAIN=1.99.0-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          # 刻意不含 cargo-llvm-cov：windows-gnu 分发里没有 profiler_builtins，`-C instrument-coverage`
          # 在这个 host 上永远起不来（run 37647787433 实测 E0463）。覆盖率档的去向见 DD-0014，
          # 接回来时要在**能测的 host** 上装，而不是留一行没人用的工具清单。
          tool: cargo-nextest,cargo-deny
      # 内化 Nosey Parker（third_party/noseyparker，见其 VENDOR.md）引入 vectorscan 这个 C++ 原生库。
      # 实测 runner 清单（images/windows/Windows2025-Readme.md）：**有** CMake 3.31 / Ninja 1.13 /
      # MSYS2(C:\msys64)，**没有** Boost 与 mingw32-make ⇒ 这两样在这里补。
      - name: vectorscan 构建前置（Boost + mingw32-make，并把 MSYS2 加进后续步骤 PATH）
        shell: bash
        # 只装包不够：vectorscan-rs-sys 的 build.rs 先用 `patch` 给源码打补丁
        # （2026-10-07 CI 实测：它在这一步断言失败，因为 runner 默认 PATH 里没有 MSYS2 的 patch/make），
        # 再走 cmake+make。所以把 mingw64/usr 两个 bin 也写进 GITHUB_PATH——这就是本机已验证能编过的组合。
        run: |
          /c/msys64/usr/bin/pacman -S --noconfirm --needed mingw-w64-x86_64-boost mingw-w64-x86_64-make mingw-w64-x86_64-pkgconf patch
          echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
          echo 'C:\msys64\usr\bin' >> "$GITHUB_PATH"
      # 冷建要编 vectorscan（本机实测 21m43s）；缓存它的构建目录，键含 vendored 提交号
      # ⇒ 上游一换（VENDOR.md 里那个 SHA）缓存自然失效，不会拿旧产物配新源码。
      - name: 缓存 vectorscan 构建产物
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            target/debug/build/vectorscan-rs-sys-*
            target/release/build/vectorscan-rs-sys-*
          key: vectorscan-${{ runner.os }}-${{ hashFiles('third_party/noseyparker/VENDOR.md') }}
      - name: fmt（只面本仓成员；cargo fmt --all 会格式化 vendored 上游源码）
        run: python -X utf8 scripts/fmt_workspace.py
      # 依赖锁漂移（M3-1 补的门）：CI 的 cargo 步骤不传 --locked，锁与声明不同步时它会照编照过，
      # 把炸点留给下一个手动跑 --locked 的人。口径与本地完全同尺（同一脚本、同一判据）。
      - name: cargo-lock（Cargo.lock ↔ 声明漂移；三态退出码）
        run: python -X utf8 scripts/cargo_lock.py
      # 检索评测集（M4-1）：生成器可重放 + 冻结查询重过防泄漏三判据 + 地板基线对账。
      # 走 bench 入口而不是 scripts/：判据与语料都在 bench/retrieval/ 下，入口脚本就叫 check.py。
      - name: retrieval-eval（M4-1：生成器可重放 + 防泄漏判据 + 地板基线）
        run: python -X utf8 bench/retrieval/check.py
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (nextest)
        run: cargo nextest run --workspace
      - name: gates（god 棘轮 + 版本锁步 + 抑制到期；本地与 CI 同尺）
        if: always()
        run: cargo run -p xtask -- gate
      # 设计债到期门接在**这条分支真正跑的 workflow**上：core.yml 只守 main（见其 on.push
      # 注释），昨天把 Debt gate 写进 core.yml 等于没接——adv-rewrite 上它一步都没跑过。
      # 纯 stdlib（json/re/subprocess），不需 pip 依赖；setup-python 沿用 core.yml 的 SHA 钉法。
      - name: Set up Python 3.14
        if: always()
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: CI wiring gate（分支 × 生效门集合；防"门接在不守这条分支的 workflow 上"）
        if: always()
        run: python -X utf8 scripts/ci_wiring_gate.py
      - name: Debt gate（设计债到期：成因必填 + ≤10 commit 限期 + SHA 可核）
        if: always()
        run: python -X utf8 scripts/debt_gate.py
      - name: deny（license/advisory/ban）
        if: always()
        run: cargo deny check
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-junit
          # CARGO_BUILD_TARGET 定了 GNU 之后，产物在 target/<triple>/ 下 ⇒ 用 ** 覆盖两种布局。
          path: target/**/nextest/**/*.junit.xml
          if-no-files-found: ignore

  # 覆盖率档（DD-0014 的修法）：**换 host**。
  # 为什么不能在 windows 那个 job 里跑：`-C instrument-coverage` 要 link `profiler_builtins`，
  # 而 windows-gnu 分发的 std 不带它（实测两路证据：CI 报 E0463、本机 rustlib 清点 gnu=0/msvc=2）；
  # 而 host 口径又被 vectorscan 反向钉死（C++ 只吃 gcc/clang）。linux-gnu 的分发带着它 ⇒ 挪过来。
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] ref 即工具链名，无固定 SHA 语义
        with:
          # 与 rust-toolchain.toml 的 channel 同步（linux 的 default host 就是 gnu，不需要显式三元组）
          toolchain: 1.99.0
          components: rustfmt, clippy, rustc-dev
      # vectorscan（vendored noseyparker 的 C++ 依赖）在 ubuntu runner 上要自己补这几件；
      # windows 那边实测缺 boost/mingw32-make/pkgconf，这边对应的就是下面这行。
      - name: vectorscan 构建前置（linux：cmake/ninja/boost/pkg-config/patch）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libboost-all-dev pkg-config patch
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov
      # 口径与本地同尺（local_gate 的 coverage-gate 步跑的就是这条命令）。
      - name: coverage-gate（cargo llvm-cov 全工作区 → lcov）
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
