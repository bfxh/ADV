# 本仓零运行时依赖（纯 stdlib），产品无 cargo/pip 升级面；依赖面只有 CI 里的 actions 与
# .github/ci-requirements.txt 的门禁工具（pytest/ruff/mypy 等，全部钉精确版本）。
# 依赖更新自成 PR（spec/PR-DISCIPLINE.md），Dependabot 每周一提，单独 review / 回滚。
version: 2
updates:
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
