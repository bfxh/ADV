# cargo-deny 配置（M0 起步档；CI 同尺：RESEARCH 05/08——锁版本 + 订阅公告是 wasmtime CVE-2026-34971 的教训）。
[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.93

[advisories]
version = 2
# 窄豁免：只豁免这一条 id、只到 DD-0015 到期为止（2026-10-08 用户拍板「窄豁免 + 登记设计债」）。
# 实测事实链：全树只有这 1 条 advisory；`gix-date 0.10.x` 版本线**止于 0.10.7**（crates.io API 实测
# 0.10.0–0.10.7 全部存在，修复只在 >=0.12.0），而 vendored 的 `input-enumerator` 钉 `gix-date = "0.10"`
# ⇒ semver 区间内取不到修复版；上游 Nosey Parker 已于 2026-02-21 退役（最后一次提交
# "Update README to reflect Nosey Parker retirement"，SHA 2e6e7f3 正是本仓 VENDOR.md 的出处锚）
# ⇒ 等不到上游修。不可达证据：出事的 `gix_date::parse::TimeBuf` 只被
# `third_party/noseyparker/crates/input-enumerator/src/git_commit_metadata.rs` 用（git 提交元数据枚举），
# 而 `adv-secrets` 的入口面只用 blob / blob_id_map / matcher / provenance / rules_database / defaults。
# ⚠ 这条豁免**不是**说"无害"：它说的是"当前入口路径够不到"。谁把 git 枚举接进来，谁就得先撤这行。
ignore = [
    { id = "RUSTSEC-2025-0140", reason = "gix-date 0.10.x 线无修复版 + 上游退役 ⇒ 不可升级；本仓入口面不触 git 解析（见 DD-0015，到期判红）" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
