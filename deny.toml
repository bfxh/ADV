# cargo-deny 配置（M0 起步档；CI 同尺：RESEARCH 05/08——锁版本 + 订阅公告是 wasmtime CVE-2026-34971 的教训）。
[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.93

[advisories]
version = 2
# 2026-10-08：这里曾有一条 RUSTSEC-2025-0140（gix-date 0.10.7）的窄豁免。M3-3c 把 vendored 树里的
# git 面剪掉之后，`gix`/`gix-date` 从依赖树整体消失（依赖包数 305 → 209），豁免随之撤销——
# 树回到"零例外"。谁要是哪天把 git 面接回来，`deny` 会立刻判红（那时请先读 DD-0015 的出圈条件）。

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
