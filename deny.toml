# cargo-deny 配置（M0 起步档；CI 同尺：RESEARCH 05/08——锁版本 + 订阅公告是 wasmtime CVE-2026-34971 的教训）。
[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.93

[advisories]
version = 2

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
